[project]
name = "hai"
version = "0.1.0"
description = "Home Automation Intelligence — daily home-automation news brief"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Adam Beguelin", email = "adam@code.pr" }]
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.28.1",
    "openai>=1.99.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "respx>=0.22.0",
]

[project.scripts]
hai = "hai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hai"]

[tool.hatch.build.targets.wheel.sources]
"src/hai" = "hai"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
